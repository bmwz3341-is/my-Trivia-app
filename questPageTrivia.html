<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>טריוויה - שאלות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="TriviaSettings.js"></script>
  <link rel="stylesheet" href="questPageTrivia.css">
  <link rel="stylesheet" href="profileLeaderboard.css">
</head>
<body>

  <div id="questPlayerBadgeContainer" class="player-badge-slot"></div>

  <main class="quest-screen">
    <button id="backButton" class="back-button" type="button" aria-label="חזרה">→</button>

    <header class="quest-header">
      <button id="scoreInfoButton" class="score-info-button" type="button" aria-label="איך עובד הניקוד?">?</button>
      <div class="quest-header__category">
        <h2 id="categoryTitle" class="category-title">טריוויה</h2>
      </div>
    </header>

    <div id="globalTimerCard" class="global-timer">
      <svg class="global-timer__ring" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="global-timer__ring-bg" cx="50" cy="50" r="42"/>
        <circle id="globalTimerRing" class="global-timer__ring-progress" cx="50" cy="50" r="42"/>
      </svg>
      <div class="global-timer__center">
        <span id="globalTimerBadge" class="global-timer__time">1:30</span>
      </div>
    </div>

    <div class="score-row">
      <span id="scoreBadge" class="score-badge">0 נק'</span>
    </div>

    <div class="progress-track">
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <div class="card-stack">
      <div class="card-stack__back card-stack__back--dark" aria-hidden="true"></div>
      <div class="card-stack__back card-stack__back--yellow" aria-hidden="true"></div>
      <section id="questionCard" class="question-card">
        <p id="questionText" class="question-text">טוען שאלה...</p>
        <div id="timerCard" class="timer-card">
          <span class="timer-card__icon" aria-hidden="true">⏱</span>
          <span id="timerBadge" class="timer-card__number">20</span>
        </div>
      </section>
    </div>

    <section id="answersGrid" class="answers-grid"></section>

    <div id="scoreInfoOverlay" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="scoreInfoTitle">
        <h3 id="scoreInfoTitle" class="modal__title">איך עובד הניקוד?</h3>
        <ul class="score-info-list">
          <li class="score-info-list__item">
            <span class="score-info-list__label">⚡ 0–4 שניות (מהיר במיוחד)</span>
            <span class="score-info-list__points">15 נק'</span>
          </li>
          <li class="score-info-list__item">
            <span class="score-info-list__label">🚀 5–8 שניות (מהיר)</span>
            <span class="score-info-list__points">12 נק'</span>
          </li>
          <li class="score-info-list__item">
            <span class="score-info-list__label">👍 9–14 שניות (רגיל)</span>
            <span class="score-info-list__points">10 נק'</span>
          </li>
          <li class="score-info-list__item">
            <span class="score-info-list__label">⏳ 15–20 שניות (איטי)</span>
            <span class="score-info-list__points">7 נק'</span>
          </li>
          <li class="score-info-list__item score-info-list__item--zero">
            <span class="score-info-list__label">❌ תשובה שגויה / נגמר הזמן</span>
            <span class="score-info-list__points">0 נק'</span>
          </li>
        </ul>
        <button id="scoreInfoCloseButton" class="modal-close-button" type="button">הבנתי!</button>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebaseConfig.js"></script>
  <script src="playerProfile.js"></script>
  <script src="leaderboard.js"></script>
  <script src="soundEffects.js"></script>
  <script src="questPageTrivia.js"></script>
</body>
</html>
