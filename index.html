<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>טריוויה - מסך הבית</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="HomePageTrivia.css">
  <link rel="stylesheet" href="profileLeaderboard.css">
</head>
<body>

  <div id="homePlayerBadgeContainer" class="player-badge-slot"></div>

  <main class="home-screen">
    <h1 class="app-title">Tick Tock Trivia</h1>
    <p class="app-subtitle">טריוויה שבודקת אתכם באמת: ידע, מהירות ואדרנלין.<br>בחרו קטגוריה והתחילו — כל תשובה מהירה שווה יותר נקודות</p>

    <button id="quickGameButton" class="quick-game-button">
      <span class="quick-game-title">אתגר מהיר</span>
    </button>

    <button id="vsPlayerButton" class="vs-player-button" type="button">
      <span>קרב מול משתמש</span>
    </button>

    <button id="leaderboardNavButton" class="leaderboard-nav-button leaderboard-nav-button--home" type="button">
      <span>🏆</span>
      <span>לוח תוצאות</span>
    </button>

    <section class="category-grid">
      <button class="category-card category-card--purple" data-category="general-trivia" type="button">
        <h3 class="category-card__title">ידע כללי וטריוויה רב-תחומית</h3>
        <p class="category-card__subtitle">מדע • טכנולוגיה • ספרות • אסטרונומיה וחלל</p>
        <div class="category-card__footer">
          <div class="category-card__difficulty">
            <span></span><span></span><span></span>
          </div>
        </div>
      </button>

      <button class="category-card category-card--teal" data-category="current-events" type="button">
        <h3 class="category-card__title">אקטואליה ועולם</h3>
        <p class="category-card__subtitle">גאוגרפיה • פוליטיקה עולמית • אירועים היסטוריים • תנ"ך</p>
        <div class="category-card__footer">
          <div class="category-card__difficulty">
            <span></span><span></span><span></span>
          </div>
        </div>
      </button>

      <button class="category-card category-card--orange" data-category="pop-culture" type="button">
        <h3 class="category-card__title">תרבות פופ ונוסטלגיה</h3>
        <p class="category-card__subtitle">כדורגל מונדיאל • סרטים וסדרות 80/90 • מוזיקה</p>
        <div class="category-card__footer">
          <div class="category-card__difficulty">
            <span></span><span></span><span></span>
          </div>
        </div>
      </button>

      <button class="category-card category-card--green" data-category="lifestyle-brands" type="button">
        <h3 class="category-card__title">מותגי לייף-סטייל</h3>
        <p class="category-card__subtitle">אוכל • כושר ובריאות • רכב • אופנה</p>
        <div class="category-card__footer">
          <div class="category-card__difficulty">
            <span></span><span></span><span></span>
          </div>
        </div>
      </button>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebaseConfig.js"></script>
  <script src="playerProfile.js"></script>
  <script src="duel.js"></script>
  <script src="duelSetup.js"></script>
  <script src="HomePageTrivia.js"></script>
</body>
</html>
