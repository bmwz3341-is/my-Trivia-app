<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;800;900&display=swap" rel="stylesheet">
<style>body{margin:0;background:#EDEAE4;font-family:'Heebo',sans-serif;display:flex;justify-content:center;padding:40px}</style>
</head>
<body>
<div style="width:360px;min-height:900px;background:linear-gradient(160deg,#FF3D81,#6C2BD9);border-radius:20px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px -20px rgba(0,0,0,0.5)">
  <div style="display:flex;justify-content:flex-end"><div style="background:#141110;color:#22D3EE;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px">מחשב 🤖</div></div>
  <div style="position:relative;display:flex;flex-direction:column;align-items:center;margin-top:10px">
    <div style="position:absolute;width:92%;top:6px;height:100%;transform:rotate(-6deg);background:#141110;border-radius:18px;box-shadow:0 10px 20px -12px rgba(0,0,0,0.5)"></div>
    <div style="position:absolute;width:92%;top:3px;height:100%;transform:rotate(5deg);background:#F5EF1E;border-radius:18px;box-shadow:0 10px 20px -12px rgba(0,0,0,0.5)"></div>
    <div style="position:relative;width:92%;background:#FFFFFF;border-radius:18px;padding:20px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 40px -16px rgba(0,0,0,0.6)">
      <h2 style="margin:0;text-align:center;color:#6C2BD9;font-size:19px;font-weight:900">עניתם על כל השאלות!</h2>
      <div style="display:flex;justify-content:center"><div style="background:#6C2BD9;color:#fff;font-weight:800;font-size:13px;padding:8px 20px;border-radius:999px">🤖 מחשב</div></div>
      <p style="margin:0;text-align:center;color:#141110;font-weight:800;font-size:15px">צברתם 15 נקודות</p>
      <p style="margin:0;text-align:center;color:#6B5541;font-size:12px">הצלחתם לענות נכון על 1 מתוך 2 שאלות שנענו</p>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
        <div style="display:flex;justify-content:space-between;align-items:center;background:#F5EFDF;border-radius:10px;padding:10px 12px"><span style="font-size:12px;color:#141110;font-weight:700">1. מהי בירת אוסטרליה?</span><span style="color:#FF3D81;font-weight:900">✕</span></div>
        <div style="display:flex;justify-content:space-between;align-items:center;background:#F5EFDF;border-radius:10px;padding:10px 12px"><span style="font-size:12px;color:#141110;font-weight:700">2. מי צייר את המונה ליזה?</span><span style="color:#3FAE6B;font-weight:900">✓</span></div>
      </div>
      <p style="margin:0;text-align:center;color:#6B5541;font-size:11px">המיקום שלכם בלוח התוצאות: #2 מתוך 2</p>
      <div style="background:#22D3EE;color:#141110;font-weight:900;font-size:15px;padding:14px;border-radius:14px;text-align:center;box-shadow:0 4px 0 #0F9BAA">שחקו שוב</div>
      <div style="background:transparent;border:2px solid #6C2BD9;color:#6C2BD9;font-weight:800;font-size:14px;padding:12px;border-radius:14px;text-align:center">חזרה למסך הבית</div>
    </div>
  </div>
  <h3 style="margin:22px 0 0;text-align:center;color:#fff;font-size:17px;font-weight:900">לוח תוצאות גלובלי</h3>
  <div style="display:flex;gap:10px"><div style="flex:1;background:#F5EF1E;color:#141110;font-weight:800;font-size:13px;padding:10px;border-radius:12px;text-align:center">קרב ראש-בראש</div><div style="flex:1;background:transparent;border:1px solid rgba(255,255,255,0.4);color:#fff;font-weight:800;font-size:13px;padding:10px;border-radius:12px;text-align:center">כללי</div></div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.14);border-radius:14px;padding:10px 14px"><span style="color:#F5EF1E;font-weight:900;font-size:14px;min-width:56px">184 נק'</span><span style="color:#fff;font-weight:700;font-size:14px;flex:1">שרון</span><span style="color:rgba(255,255,255,0.6);font-size:12px">#1</span></div>
    <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.14);border-radius:14px;padding:10px 14px"><span style="color:#F5EF1E;font-weight:900;font-size:14px;min-width:56px">84 נק'</span><span style="color:#fff;font-weight:700;font-size:14px;flex:1">עידו</span><span style="color:rgba(255,255,255,0.6);font-size:12px">#2</span></div>
  </div>
</div>
</body>
</html>
