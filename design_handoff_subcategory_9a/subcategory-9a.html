<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;800;900&display=swap" rel="stylesheet">
<style>body{margin:0;background:#EDEAE4;font-family:'Heebo',sans-serif;display:flex;justify-content:center;padding:40px}</style>
</head>
<body>
<div style="width:340px;min-height:600px;background:linear-gradient(160deg,#FF3D81,#6C2BD9);border-radius:24px;padding:36px 22px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 20px 50px -20px rgba(0,0,0,0.5)">
  <div style="width:100%;aspect-ratio:5/7;position:relative;margin-top:14px">
    <div style="position:absolute;inset:0;transform:rotate(18deg) translate(16px,-8px);background:#22D3EE;border-radius:16px;box-shadow:0 12px 24px -14px rgba(0,0,0,0.5)"></div>
    <div style="position:absolute;inset:0;transform:rotate(-12deg) translate(-16px,8px);background:#6C2BD9;border-radius:16px;box-shadow:0 12px 24px -14px rgba(0,0,0,0.5)"></div>
    <div style="position:absolute;inset:0;transform:rotate(5deg) translate(4px,4px);background:#F5EF1E;border-radius:16px;box-shadow:0 12px 24px -14px rgba(0,0,0,0.5)"></div>
    <div style="position:absolute;inset:0;transform:rotate(2deg);background:#FFFFFF;border-radius:16px;box-shadow:0 18px 40px -16px rgba(0,0,0,0.6);padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px">
      <div style="position:absolute;top:10px;right:12px;color:#6C2BD9;font-weight:900;font-size:20px;line-height:0.9">J<div style="font-size:14px">♥</div></div>
      <h3 style="margin:0;text-align:center;color:#141110;font-size:16px;font-weight:900;margin-top:6px">ידע כללי</h3>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center;padding:0 6px">
        <div style="display:flex;justify-content:space-between;border-bottom:1.5px solid #6C2BD9;padding:6px 2px"><span style="font-weight:700;font-size:13px;color:#141110">טכנולוגיה</span><span style="color:#FF3D81;font-weight:800;font-size:11px">80</span></div>
        <div style="display:flex;justify-content:space-between;border-bottom:1.5px solid #6C2BD9;padding:6px 2px"><span style="font-weight:700;font-size:13px;color:#141110">מדע</span><span style="color:#FF3D81;font-weight:800;font-size:11px">200</span></div>
        <div style="display:flex;justify-content:space-between;border-bottom:1.5px solid #6C2BD9;padding:6px 2px"><span style="font-weight:700;font-size:13px;color:#141110">אמנות</span><span style="color:#FF3D81;font-weight:800;font-size:11px">2</span></div>
        <div style="display:flex;justify-content:space-between;padding:6px 2px"><span style="font-weight:700;font-size:13px;color:#141110">ספרות</span><span style="color:#FF3D81;font-weight:800;font-size:11px">100</span></div>
      </div>
    </div>
  </div>
  <span style="color:rgba(255,255,255,0.75);font-size:12px;margin-top:26px">בחרו תת-קטגוריה כדי להתחיל</span>
</div>
</body>
</html>
