<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>טריוויה - בחירת תת-קטגוריה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="TriviaSettings.js"></script>
  <link rel="stylesheet" href="subCategoryPage.css">
</head>
<body>

  <button id="backButton" class="back-button" type="button" aria-label="חזרה">→</button>

  <main class="sub-screen">
    <div class="card-spread">
      <div class="card card--back card--cyan"></div>
      <div class="card card--back card--purple"></div>
      <div class="card card--back card--yellow"></div>
      <div class="card card--main">
        <div class="card__corner">
          <span id="cornerRank">A</span>
          <span class="card__suit" id="cornerSuit">♠</span>
        </div>
        <h2 class="card__title" id="mainCategoryTitle">טריוויה</h2>
        <div class="card__rows" id="subCategoryRows"></div>
      </div>
    </div>

    <p class="sub-screen__hint">בחרו תת-קטגוריה כדי להתחיל</p>
  </main>

  <script src="subCategoryPage.js"></script>
</body>
</html>
