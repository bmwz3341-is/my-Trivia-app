<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;800;900&display=swap" rel="stylesheet">
<style>body{margin:0;background:#EDEAE4;font-family:'Heebo',sans-serif;display:flex;justify-content:center;padding:40px}
.h2h-card{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.h2h-card:active{transform:scale(0.96);box-shadow:0 0 0 3px #22D3EE,0 2px 8px -4px rgba(0,0,0,0.5)}
</style>
</head>
<body>
<div style="width:340px;min-height:680px;background:linear-gradient(160deg,#FF3D81,#6C2BD9);border-radius:24px;padding:28px 20px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 20px 50px -20px rgba(0,0,0,0.5)">
  <h2 style="margin:0;text-align:center;color:#fff;font-size:22px;font-weight:900">קרב ראש-בראש</h2>
  <p style="margin:0 0 14px;text-align:center;color:rgba(255,255,255,0.85);font-size:13px;font-weight:600">בחר קטגוריה לקרב המהיר</p>

  <div style="position:relative;width:100%;background:#141110;border-radius:18px;padding:22px 14px 18px;box-sizing:border-box;box-shadow:0 20px 40px -18px rgba(0,0,0,0.7),inset 0 2px 0 rgba(255,255,255,0.08);display:flex;flex-direction:column;gap:10px">
    <div style="position:absolute;left:14px;right:14px;top:-10px;height:20px;background:#0A0808;border-radius:10px 10px 0 0"></div>

    <div class="h2h-card" style="background:#6A3FB5;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 14px -8px rgba(0,0,0,0.5)">
      <span style="color:#fff;font-weight:900;font-size:16px;line-height:0.9">Q<div style="font-size:11px">♣</div></span>
      <span style="color:#fff;font-weight:800;font-size:14px;flex:1">ידע כללי וטריוויה רב-תחומית</span>
    </div>
    <div class="h2h-card" style="background:#3FAE6B;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 14px -8px rgba(0,0,0,0.5)">
      <span style="color:#fff;font-weight:900;font-size:16px;line-height:0.9">K<div style="font-size:11px">♦</div></span>
      <span style="color:#fff;font-weight:800;font-size:14px;flex:1">אקטואליה ועולם</span>
    </div>
    <div class="h2h-card" style="background:#F5EF1E;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 14px -8px rgba(0,0,0,0.5)">
      <span style="color:#141110;font-weight:900;font-size:16px;line-height:0.9">J<div style="font-size:11px">♠</div></span>
      <span style="color:#141110;font-weight:800;font-size:14px;flex:1">תרבות פופ ונוסטלגיה</span>
    </div>
    <div class="h2h-card" style="background:#fff;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 6px 14px -8px rgba(0,0,0,0.5)">
      <span style="color:#FF3D81;font-weight:900;font-size:16px;line-height:0.9">A<div style="font-size:11px">♥</div></span>
      <span style="color:#141110;font-weight:800;font-size:14px;flex:1">מותגי לייף-סטייל</span>
    </div>
  </div>
  <div style="width:70%;height:14px;background:radial-gradient(ellipse,rgba(0,0,0,0.35),transparent 70%);margin-top:-4px"></div>
</div>
</body>
</html>
