<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;800;900&display=swap" rel="stylesheet">
<style>body{margin:0;background:#EDEAE4;font-family:'Heebo',sans-serif;display:flex;justify-content:center;padding:40px}</style>
</head>
<body>
<div style="width:340px;min-height:760px;background:linear-gradient(160deg,#FF3D81,#6C2BD9);border-radius:20px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px -20px rgba(0,0,0,0.5)">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div style="background:#F5EF1E;color:#141110;font-weight:900;font-size:14px;padding:8px 16px;border-radius:14px">15 נק'</div>
    <div style="display:flex;align-items:center;gap:8px"><span style="color:#fff;font-weight:800;font-size:15px">מדע</span><div style="background:#141110;color:#fff;font-size:16px;padding:6px 10px;border-radius:999px">🤖</div></div>
  </div>
  <div style="display:flex;justify-content:center">
    <div style="width:82px;height:82px;border-radius:50%;background:conic-gradient(#22D3EE 300deg, rgba(0,0,0,0.25) 0deg);display:flex;align-items:center;justify-content:center">
      <div style="width:66px;height:66px;border-radius:50%;background:#6C2BD9;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:24px">1:22</div>
    </div>
  </div>
  <div style="height:6px;background:rgba(0,0,0,0.25);border-radius:6px;overflow:hidden"><div style="width:78%;height:100%;background:#22D3EE"></div></div>
  <div style="position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:150px">
    <div style="position:absolute;width:90%;height:88%;transform:rotate(-6deg);background:#141110;border-radius:16px;box-shadow:0 10px 20px -12px rgba(0,0,0,0.5)"></div>
    <div style="position:absolute;width:90%;height:88%;transform:rotate(5deg);background:#F5EF1E;border-radius:16px;box-shadow:0 10px 20px -12px rgba(0,0,0,0.5)"></div>
    <div style="position:relative;width:90%;background:#FFFFFF;border-radius:16px;box-shadow:0 18px 40px -16px rgba(0,0,0,0.6);padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px">
      <p style="margin:0;color:#141110;font-size:16px;font-weight:800;line-height:1.5;text-align:center">איזה יסוד כימי מסומן באותיות 'Au'?</p>
      <div style="display:flex;align-items:center;gap:6px;justify-content:flex-start;color:#6C2BD9;font-size:12px;font-weight:700">⏱ 14</div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="background:rgba(255,255,255,0.14);border:2px solid rgba(255,255,255,0.35);color:#fff;font-weight:800;font-size:14px;padding:14px;border-radius:14px;text-align:center">כסף</div>
    <div style="background:rgba(255,255,255,0.14);border:2px solid rgba(255,255,255,0.35);color:#fff;font-weight:800;font-size:14px;padding:14px;border-radius:14px;text-align:center">אלומיניום</div>
    <div style="background:rgba(255,255,255,0.14);border:2px solid rgba(255,255,255,0.35);color:#fff;font-weight:800;font-size:14px;padding:14px;border-radius:14px;text-align:center">ארגון</div>
    <div style="background:#22D3EE;color:#141110;font-weight:800;font-size:14px;padding:14px;border-radius:14px;text-align:center">זהב</div>
  </div>
</div>
</body>
</html>
